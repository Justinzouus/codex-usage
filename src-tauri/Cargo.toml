[package]
name = "codex-usage-widget"
version = "1.0.0"
description = "A privacy-first Codex quota monitor for the macOS menu bar"
authors = ["Codex Usage contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "codex_usage_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = "2"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "sync", "time"] }

[patch.crates-io]
tray-icon = { path = "vendor/tray-icon" }

[profile.release]
strip = true
